name: Deploy embedding-service DEV

on:
  push:
    branches:
      - develop
      - feat/embedding-service-api # TODO: usunąć przed mergem
    paths:
      - "services/embedding-service/**"
      - "infra/embedding-service/**"
      - ".github/workflows/deploy-embedding-service.yml"

env:
  PROJECT_ID: paw-2026-496213
  REGION: europe-central2
  REGISTRY: europe-central2-docker.pkg.dev
  REPOSITORY: mini-allegro
  IMAGE: embedding-service
  SERVICE_DEV: embedding-service-dev

jobs:
  validate-secrets:
    name: Validate required secrets
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets are set
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          missing=0
          if [ -z "$GCP_SA_KEY" ]; then
            echo "Missing required secret: GCP_SA_KEY"
            missing=1
          fi
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "Missing required secret: TF_STATE_BUCKET"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

  build:
    name: Build and push Docker image
    needs: validate-secrets
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Generate image tag
        id: meta
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}-dev"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/embedding-service
          file: services/embedding-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform apply (embedding-service infra)
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket exists
        run: |
          gcloud storage buckets describe gs://${{ secrets.TF_STATE_BUCKET }} --project=${{ env.PROJECT_ID }} >/dev/null 2>&1 || \
          gcloud storage buckets create gs://${{ secrets.TF_STATE_BUCKET }} --project=${{ env.PROJECT_ID }} --location=${{ env.REGION }}

      - name: Terraform init
        working-directory: infra/embedding-service
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=embedding-service/dev"

      - name: Terraform apply
        working-directory: infra/embedding-service
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -var="image=${{ needs.build.outputs.image_tag }}"

  ensure-qdrant:
    name: Ensure Qdrant VM is running
    needs: terraform
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Start Qdrant VM if stopped
        run: |
          STATUS=$(gcloud compute instances describe qdrant-dev \
            --zone=${{ env.REGION }}-a \
            --format='value(status)')
          echo "Qdrant VM status: $STATUS"
          if [ "$STATUS" != "RUNNING" ]; then
            echo "Starting Qdrant VM..."
            gcloud compute instances start qdrant-dev --zone=${{ env.REGION }}-a
          fi

      - name: Wait for Qdrant to be healthy
        run: |
          QDRANT_IP=$(gcloud compute addresses describe qdrant-dev-ip \
            --region=${{ env.REGION }} \
            --format='value(address)')
          echo "Qdrant IP: $QDRANT_IP"
          for i in $(seq 1 30); do
            if curl -sf "http://$QDRANT_IP:6333/healthz" >/dev/null 2>&1; then
              echo "Qdrant is healthy"
              exit 0
            fi
            echo "Waiting for Qdrant... ($i/30)"
            sleep 10
          done
          echo "Qdrant failed to become healthy after 5 minutes"
          exit 1

  deploy:
    name: Deploy to Cloud Run DEV
    needs: [build, terraform, ensure-qdrant]
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run DEV
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_DEV }}
          region: ${{ env.REGION }}
          image: ${{ needs.build.outputs.image_tag }}
          flags: --allow-unauthenticated

      - name: Health check GET /health
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_DEV }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "DEV URL: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed! Got HTTP $STATUS"
            exit 1
          fi
          echo "embedding-service is healthy"
