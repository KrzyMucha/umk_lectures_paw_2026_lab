name: Deploy product-review-service

on:
  push:
    branches:
      - develop
    paths:
      - "services/product-review-service/**"
      - "infra/product-review-service/**"
      - ".github/workflows/deploy-product-review-service.yml"
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: dev
      service_name:
        required: false
        type: string
        default: product-review-service-dev
      image_tag_suffix:
        required: false
        type: string
        default: dev
      sha:
        required: false
        type: string
    secrets:
      GCP_SA_KEY:
        required: true
      TF_STATE_BUCKET:
        required: true
      DATABASE_URL:
        required: true
    outputs:
      product_review_service_url:
        description: "Deployed product-review-service Cloud Run URL"
        value: ${{ jobs.deploy.outputs.product_review_service_url }}

env:
  PROJECT_ID: paw-2026-496213
  REGION: europe-central2
  REGISTRY: europe-central2-docker.pkg.dev
  REPOSITORY: mini-allegro
  IMAGE: product-review-service
  SERVICE_DEV: product-review-service-dev

jobs:
  validate-secrets:
    name: Validate required secrets
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets are set
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DEV_DATABASE_URL }}
        run: |
          missing=0
          if [ -z "$GCP_SA_KEY" ]; then
            echo "Missing required secret: GCP_SA_KEY"
            missing=1
          fi
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "Missing required secret: TF_STATE_BUCKET"
            missing=1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing required secret: DATABASE_URL"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

  build:
    name: Build and push Docker image
    needs: validate-secrets
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Generate image tag
        id: meta
        run: |
          SOURCE_SHA="${{ inputs.sha || github.sha }}"
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${SOURCE_SHA}-${{ inputs.image_tag_suffix || 'dev' }}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/product-review-service
          file: services/product-review-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform apply (product-review-service infra)
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket exists
        run: |
          gcloud storage buckets describe gs://${{ secrets.TF_STATE_BUCKET }} --project=${{ env.PROJECT_ID }} >/dev/null 2>&1 || \
          gcloud storage buckets create gs://${{ secrets.TF_STATE_BUCKET }} --project=${{ env.PROJECT_ID }} --location=${{ env.REGION }}

      - name: Terraform init
        working-directory: infra/product-review-service
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=product-review-service/${{ inputs.environment || 'dev' }}"

      - name: Terraform apply
        working-directory: infra/product-review-service
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -var="image=${{ needs.build.outputs.image_tag }}" \
            -var="service_name=${{ inputs.service_name || env.SERVICE_DEV }}" \
            -var="database_url=${{ secrets.DATABASE_URL || secrets.DEV_DATABASE_URL }}"

  deploy:
    name: Deploy to Cloud Run
    needs: [build, terraform]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      product_review_service_url: ${{ steps.url.outputs.product_review_service_url }}

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run DEV
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service_name || env.SERVICE_DEV }}
          region: ${{ env.REGION }}
          image: ${{ needs.build.outputs.image_tag }}

      - name: Health check GET /product-reviews
        run: |
          URL=$(gcloud run services describe ${{ inputs.service_name || env.SERVICE_DEV }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "DEV URL: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/product-reviews")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed! Got HTTP $STATUS"
            exit 1
          fi
          echo "product-review-service is healthy"

      - name: Output service URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ inputs.service_name || env.SERVICE_DEV }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "product_review_service_url=${URL}" >> "$GITHUB_OUTPUT"
