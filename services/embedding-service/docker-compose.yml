services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    ports:
      - "8084:8080"
    environment:
      PORT: "8080"
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      - qdrant

volumes:
  qdrant_data:
